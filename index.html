<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ôn tập Sinh học 11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: câu hỏi ở cột chính bên trái, bảng câu hỏi và tiến độ ở cột phải; trên điện thoại xếp thành một cột. */
:root{
  --bg:#EDF2EA; --surface:#FAFCF8; --ink:#14291F; --muted:#586E61; --line:#C9D7CB;
  --accent:#0F5F63; --accent-ink:#FFFFFF;
  --ok:#1D7A4B; --ok-soft:#D4EBDB; --bad:#C5402C; --bad-soft:#F7DAD3; --sun:#EBB92D; --sun-soft:#FBF0C9;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1913; --surface:#15261D; --ink:#E4EFE7; --muted:#90A89A; --line:#2B4235;
  --accent:#5CC3C8; --accent-ink:#06201F;
  --ok:#52C98C; --ok-soft:#1A3B2A; --bad:#FF8C76; --bad-soft:#40211B; --sun:#F0C94A; --sun-soft:#3A3315; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1913; --surface:#15261D; --ink:#E4EFE7; --muted:#90A89A; --line:#2B4235;
  --accent:#5CC3C8; --accent-ink:#06201F;
  --ok:#52C98C; --ok-soft:#1A3B2A; --bad:#FF8C76; --bad-soft:#40211B; --sun:#F0C94A; --sun-soft:#3A3315; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font:800 clamp(2rem,5.5vw,3.4rem)/1.02 var(--display);letter-spacing:-.025em;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 22px;max-width:60ch}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:26px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:999px;font-weight:500;font-size:.9rem;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:.92rem;font-weight:500;user-select:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);gap:24px}}

/* question card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3.4vw,34px);min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font-size:.8rem;font-weight:500;padding:3px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.k{background:var(--sun-soft);border-color:transparent;color:var(--ink)}
.qtext{font:600 clamp(1.15rem,2.6vw,1.45rem)/1.4 var(--display);letter-spacing:-.005em;margin:0 0 20px;max-width:62ch;text-wrap:pretty}
.ctx{margin:0 0 20px;padding:14px 16px;background:var(--bg);border-radius:12px;font-size:.95rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:6px 20px}
.ctx b{font-weight:600}
@media (max-width:520px){.ctx{grid-template-columns:minmax(0,1fr)}}
.fig{display:block;width:100%;max-width:520px;border-radius:12px;border:1px solid var(--line);margin:0 0 20px;background:#fff}

.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:center;width:100%;text-align:left;
  padding:12px 16px 12px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--bg)}
.opt .l{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:800 1rem var(--display);color:var(--muted);transition:all .12s}
.opt:hover:not([disabled]) .l{border-color:var(--accent);color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.opt.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.985)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.opt.pop{animation:none}*{transition:none!important}}

/* true / false */
.tf{display:grid;gap:10px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px}
.row .l{font:800 1rem var(--display);color:var(--muted)}
.row.ok{border-color:var(--ok);background:var(--ok-soft)}
.row.bad{border-color:var(--bad);background:var(--bad-soft)}
.tfb{display:flex;gap:6px}
.tfb button{min-width:64px;padding:7px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.tfb button:hover:not([disabled]){border-color:var(--accent)}
.tfb button[disabled]{cursor:default;opacity:.55}
.tfb button.right{opacity:1;background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tfb button.wrong{opacity:1;background:var(--bad);border-color:var(--bad);color:var(--surface)}
.tfb button.was{opacity:1;border-color:var(--ok);color:var(--ok)}
@media (max-width:560px){.row{grid-template-columns:30px minmax(0,1fr)}.tfb{grid-column:1/-1}.tfb button{flex:1}}

/* short answer */
.sa{display:flex;flex-wrap:wrap;gap:10px}
.sa input{flex:1 1 200px;min-width:0;font:600 1.1rem var(--body);padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.sa input:disabled{opacity:.8}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:12px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.reveal{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:500}
.reveal.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}
.reveal.bad{background:var(--bad-soft);border:1.5px solid var(--bad)}
.reveal b{font-weight:800;font-family:var(--display)}

.fb{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.fb .v{font:800 1.1rem var(--display);margin:0}
.fb .v.ok{color:var(--ok)} .fb .v.bad{color:var(--bad)}
.note{flex-basis:100%;margin:0;color:var(--muted);font-size:.9rem;max-width:62ch}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

/* side */
.side{display:grid;gap:22px;min-width:0}
.stat{display:grid;gap:10px}
.nums{display:flex;gap:18px;flex-wrap:wrap;font-weight:500}
.nums b{font:800 1.7rem/1 var(--display);margin-right:5px}
.nums .o b{color:var(--ok)} .nums .x b{color:var(--bad)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%;transition:width .25s}
.bar .o{background:var(--ok)} .bar .x{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.c{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;font-weight:600;font-size:.82rem;display:grid;place-items:center;color:var(--muted)}
.c:hover{border-color:var(--accent)}
.c.right{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.c.wrong{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.c.part{background:var(--sun-soft);border-color:var(--sun);color:var(--ink)}
.c.cur{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--line)}
.legend .o::before{background:var(--ok)} .legend .x::before{background:var(--bad)} .legend .p::before{background:var(--sun)}
.h2{font:800 1.05rem var(--display);margin:0 0 10px}
.side .btn{width:100%}
.sum h2{font:800 clamp(2rem,6vw,3.2rem)/1 var(--display);margin:0 0 6px}
.sum p{margin:0 0 18px;color:var(--muted)}
.sum .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.sum .grid{max-width:520px}
@media (max-width:860px){.side{order:2}}
</style>

<div class="wrap">
  <h1>Ôn tập Sinh học 11</h1>
  <p class="sub">Bài 1 Khái quát về trao đổi chất và chuyển hóa năng lượng, Bài 2 Trao đổi nước và khoáng ở thực vật. Chọn một đáp án là thấy kết quả ngay.</p>

  <div class="controls">
    <div class="seg" id="segLesson" role="group" aria-label="Chọn bài">
      <button data-v="1">Bài 1</button><button data-v="2">Bài 2</button><button data-v="all">Cả hai bài</button>
    </div>
    <div class="seg" id="segPart" role="group" aria-label="Chọn dạng câu hỏi">
      <button data-v="all">Tất cả</button><button data-v="mc">Nhiều lựa chọn</button><button data-v="tf">Đúng sai</button><button data-v="sa">Trả lời ngắn</button>
    </div>
    <label class="switch"><input type="checkbox" id="shuf" checked><i></i>Xáo trộn câu và đáp án</label>
  </div>

  <div class="app">
    <main id="main"></main>
    <aside class="side">
      <div class="stat">
        <div class="nums"><span class="o"><b id="nOk">0</b>đúng</span><span class="x"><b id="nBad">0</b>sai</span><span><b id="nLeft">0</b>chưa làm</span></div>
        <div class="bar" aria-hidden="true"><i class="o" id="bOk"></i><i class="x" id="bBad"></i></div>
      </div>
      <div>
        <h2 class="h2">Danh sách câu</h2>
        <div class="grid" id="grid"></div>
        <div class="legend" style="margin-top:12px"><span class="o">Đúng</span><span class="x">Sai</span><span class="p">Làm dở</span></div>
      </div>
      <div style="display:grid;gap:10px">
        <button class="btn ghost" id="bRes">Xem kết quả</button>
        <button class="btn ghost" id="bRe">Xáo trộn và làm lại</button>
      </div>
    </aside>
  </div>
</div>

{l:1,p:"mc",n:7,t:"Dị dưỡng là quá trình dinh dưỡng mà sinh vật:",o:["Có khả năng tổng hợp chất vô cơ thành chất hữu cơ","Có khả năng tổng hợp chất hữu cơ từ những chất hữu cơ có sẵn","Có khả năng tổng hợp chất dinh dưỡng thông qua quang hợp","Không có khả năng tổng hợp chất hữu cơ từ chất hữu cơ có sẵn"],a:1},
{l:1,p:"mc",n:8,t:"Quá trình chuyển hóa năng lượng trong sinh giới bao gồm:",o:["Tiêu thụ, phân giải, huy động năng lượng","Hấp thu, phân giải và huy động năng lượng","Tổng hợp, phân giải và huy động năng lượng","Tái hấp thu, phân giải và huy động năng lượng"],a:2},
{l:1,p:"mc",n:9,t:"Ví dụ về việc thu nhận các chất từ môi trường là:",o:["Lá cây hấp thụ ánh sáng","Chuyển hóa tinh bột thành glucose","Quá trình quang hợp","Các chất không sử dụng được sẽ bị đào thải khỏi cơ thể"],a:0},
{l:1,p:"mc",n:10,t:"Mọi cơ thể sống đều không ngừng trao đổi chất và chuyển hóa năng lượng với môi trường, khi quá trình này dừng lại thì:",o:["Sinh vật sẽ sinh trưởng","Sinh vật sẽ phát triển","Sinh vật sẽ chết","Sinh vật sẽ vận động và sinh sản"],a:2},
{l:1,p:"mc",n:11,t:"Các dấu hiệu đặc trưng của quá trình trao đổi chất và chuyển hóa năng lượng ở sinh vật KHÔNG bao gồm:",o:["Thu nhận các chất từ môi trường","Biến đổi các chất","Bài tiết các chất","Đào thải các chất"],a:2,note:"Đề gốc có hai đáp án C và D gần nghĩa nhau, nên câu này nên hỏi lại thầy cô."},
{l:1,p:"mc",n:12,t:"Cơ thể người lấy từ môi trường oxy, nước và thức ăn để chuyển hóa thành năng lượng tích lũy ở dạng:",o:["ATP","ADP","Vô cơ","Nhiệt"],a:0},
{l:1,p:"mc",n:13,t:"Ghép nội dung ở cột bên phải với nội dung ở cột bên trái để trở thành một câu đúng về ví dụ của dấu hiệu đặc trưng cho quá trình trao đổi chất và chuyển hóa năng lượng:",
  tb:[["1. Bài tiết các chất","a. Dạ dày co bóp và tiết enzyme pepsin để tiêu hóa protein trong thức ăn."],["2. Biến đổi các chất","b. Máu đưa O₂ từ hệ hô hấp và các chất dinh dưỡng được hấp thụ ở hệ tiêu hóa đến từng tế bào."],["3. Thu nhận các chất","c. Thận thải ure và các chất không cần thiết thông qua nước tiểu."],["4. Vận chuyển các chất","d. Cây bàng hấp thụ nước và các ion khoáng thông qua các tế bào lông hút ở rễ."]],
  o:["1-a, 2-b, 3-c, 4-d","1-c, 2-a, 3-d, 4-b","1-c, 2-a, 3-b, 4-d","1-a, 2-c, 3-d, 4-b"],a:1},
{l:1,p:"tf",n:1,t:"Mỗi nhận định sau là đúng hay sai khi nói về vai trò trao đổi chất và chuyển hóa năng lượng ở sinh vật?",s:[["Bài tiết các chất độc hại ra khỏi cơ thể.",1],["Cung cấp nguyên liệu xây dựng tế bào và cơ thể.",1],["Cung cấp năng lượng cho các hoạt động sống của sinh vật.",1],["Giúp sinh vật truyền lại các đặc điểm di truyền cho thế hệ sau.",0]]},
{l:1,p:"tf",n:2,t:"Khi nói về vai trò của sinh vật tự dưỡng, mỗi mệnh đề sau là đúng hay sai?",s:[["Cung cấp oxygen, điều hòa khí hậu.",1],["Cung cấp nơi ở, nơi sinh sản cho động vật.",1],["Phân giải chất thải, xác của các sinh vật khác.",0],["Cung cấp vật chất và năng lượng cho sinh giới.",1]]},
{l:1,p:"sa",n:1,t:"Quá trình chuyển hóa năng lượng trong sinh giới trải qua mấy giai đoạn?",a:"3"},
{l:1,p:"sa",n:2,t:"Trong số các chất: O₂, CO₂, nước tiểu và phân, có bao nhiêu chất là chất thải ở cả động vật và thực vật?",a:"1"},
{l:1,p:"sa",n:3,t:"Cho các sinh vật sau đây. Có bao nhiêu sinh vật dị dưỡng?\na. Cây chuối   b. Vi khuẩn lam   c. Nấm da đầu   d. Tảo lục\ne. Trùng giày   f. Con bò   g. Vi khuẩn trong ruột mối\nh. Rong đuôi chó   i. San hô   k. Giun, sán",a:"6"},

/* ===== BÀI 2 ===== */
{l:2,p:"mc",n:1,t:"Nguyên tố dinh dưỡng khoáng thiết yếu trong cây là nguyên tố",o:["thiếu nó cây không hoàn thành được chu trình sống.","có thể thay thế bởi một nguyên tố khác khi cây cần sử dụng.","tham gia gián tiếp vào quá trình chuyển hóa vật chất.","chiếm hàm lượng lớn hơn các nguyên tố khác trong cơ thể"],a:0},
{l:2,p:"mc",n:2,t:"Thiếu sắt (Fe) thì cây bị vàng, nguyên nhân vì sắt là",o:["thành phần cấu tạo diệp lục.","enzyme xúc tác tổng hợp diệp lục.","thành phần cấu tạo lục lạp.","enzyme xúc tác cho quang hợp."],a:1},
{l:2,p:"mc",n:3,t:"Nguyên tố đa lượng đóng vai trò chủ yếu",o:["tham gia cấu trúc nên tế bào.","hoạt hóa enzyme trong trao đổi chất.","qui định áp suất thẩm thấu của dịch tế bào.","thúc đẩy quá trình chín của quả và hạt."],a:0},
{l:2,p:"mc",n:4,t:"Khi cây bị vàng úa, đưa vào gốc hoặc phun lên lá ion khoáng loại nào sau đây lá cây sẽ xanh trở lại?",o:["Mg²⁺","Ca²⁺","Fe³⁺","Na⁺"],a:2,note:"Mg²⁺ và Fe³⁺ đều liên quan đến diệp lục. Mình chọn Fe³⁺ để khớp với câu 2, nên nên hỏi lại thầy cô."},
{l:2,p:"mc",n:5,t:"Quá trình trao đổi nước và khoáng ở thực vật diễn ra theo thứ tự?",o:["Hấp thụ nước ở rễ → thoát hơi nước ở lá → vận chuyển nước ở thân.","Hấp thụ nước ở rễ → vận chuyển nước ở thân → thoát hơi nước ở lá.","Vận chuyển nước ở thân → thoát hơi nước ở lá → hấp thụ nước ở rễ.","Vận chuyển nước ở thân → hấp thụ nước ở rễ → thoát hơi nước ở lá."],a:1},
{l:2,p:"mc",n:6,t:"Các nguyên tố khoáng được cây hấp thụ dưới dạng",o:["hợp chất.","đơn chất.","chất kết tủa.","ion hòa tan."],a:3},
{l:2,p:"mc",n:7,t:"Thực vật trên cạn, nước và khoáng từ đất được hấp thụ nhờ các",o:["tế bào biểu bì của toàn bộ cây.","tế bào mạch gỗ ở rễ.","tế bào mạch rây ở rễ","lông hút ở rễ."],a:3},
{l:2,p:"mc",n:8,t:"Thực vật thủy sinh, nước và khoáng được hấp thụ nhờ các",o:["tế bào biểu bì của toàn bộ cây.","mạch gỗ ở rễ.","lông hút ở lá.","lông hút ở rễ."],a:0},
{l:2,p:"mc",n:9,t:"Khi nói đến quá trình vận chuyển nước trong cây, phát biểu nào sai?",o:["Chịu ảnh hưởng của áp suất rễ.","Liên quan với lực đẩy do áp suất rễ.","Cùng chiều với chiều của trọng lực.","Liên quan với lực hút do thoát hơi nước ở lá."],a:2},
{l:2,p:"mc",n:10,t:"Nguyên nhân nào sau đây làm tế bào lông hút luôn ưu trương so với dung dịch đất?\n(1) Rễ hấp thụ các ion khoáng từ đất và tích lũy các chất tan từ quá trình chuyển hóa vật chất.\n(2) Thoát hơi nước ở lá làm giảm lượng nước ở tế bào lông hút.\n(3) Rễ hấp thụ nước và tích lũy nước từ quá trình chuyển hóa vật chất.\n(4) Rễ tiết các chất làm phân giải các chất tan trong dung dịch đất.",o:["1, 2","1, 3","1, 4","2, 3"],a:0},
{l:2,p:"mc",n:11,t:"Khi nói đến ý nghĩa sự thoát hơi nước ở lá, phát biểu nào sai?",o:["Tạo ra lực hút nước ở rễ.","Điều hoà nhiệt độ bề mặt thoát hơi nước.","Tạo lực liên kết giữa các phân tử nước.","Tạo điều kiện cho CO₂ từ không khí vào lá thực hiện chức năng quang hợp."],a:2},
{l:2,p:"mc",n:12,t:"Sự thoát hơi nước ở lá có thể diễn ra bằng 2 con đường qua cutin và khí khổng, tuy nhiên chủ yếu diễn ra qua con đường khí khổng. Vì sao?",o:["Có vận tốc lớn, không được điều chỉnh.","Có vận tốc lớn, được điều chỉnh bằng cơ chế đóng mở khí khổng.","Có vận tốc nhỏ, không được điều chỉnh.","Có vận tốc nhỏ, được điều chỉnh bằng cơ chế đóng mở khí khổng"],a:1},
{l:2,p:"mc",n:13,t:"Sự hấp thụ khoáng theo cơ chế thụ động diễn ra theo nguyên lí",o:["nhập bào","chủ động","thẩm thấu.","khuếch tán"],a:3},
{l:2,p:"mc",n:14,t:"Trong nguyên lí khuếch tán, các khoáng chất được vận chuyển từ nơi có",o:["nồng độ cao đến nơi nồng độ thấp, cần tiêu tốn năng lượng.","nồng độ cao đến nơi nồng độ thấp, không tiêu tốn năng lượng.","nồng độ thấp đến nơi nồng độ cao, không tiêu tốn năng lượng.","nồng độ thấp đến nơi nồng độ cao, tiêu tốn năng lượng."],a:1},
{l:2,p:"mc",n:15,t:"Biểu bì của lá những cây sống ở vùng khô hạn có đặc điểm nào?",o:["Biểu bì mặt dưới của lá được phủ bởi lớp cutin dày.","Biểu bì mặt trên của lá được phủ bởi lớp cutin dày, có rất ít hoặc không có khí khổng.","Biểu bì mặt dưới của lá được phủ bởi lớp cutin dày, không có lỗ khí.","Biểu bì mặt trên của lá có rất nhiều tế bào khí khổng."],a:1},
{l:2,p:"mc",n:16,t:"Tác nhân nào trực tiếp điều tiết độ mở của khí khổng?",o:["Cường độ quang hợp và nồng độ CO₂ trong không khí.","Hàm lượng nước trong tế bào khí khổng.","Nồng độ CO₂ trong không khí.","Nhiệt độ môi trường."],a:1},
{l:2,p:"mc",n:17,t:"Cây trên cạn khi bị ngập úng lâu ngày sẽ bị chết. Có bao nhiêu giải thích sau đây đúng?\nI. Thừa oxi hạn chế hô hấp và tích luỹ chất độc.\nII. Lông hút bị chết và không hình thành lông hút mới.\nIII. Cây sẽ hấp thụ được nước và khoáng quá nhiều.\nIV. Sẽ tăng quá trình lên men gây tích lũy độc tố, lông hút sẽ chết và không hình thành lông hút mới làm cho cây không được hút nước và khoáng.",o:["1","2","3","4"],a:1,fix:1},
{l:2,p:"mc",n:18,t:"Trong trồng trọt, một số cây người ta nhổ cây con lên rồi đem cấy sẽ có tác dụng gì?",o:["Thay đổi mật độ cây giúp cây sử dụng tốt ánh sáng và dinh dưỡng.","Chóp rễ đứt sẽ kích thích sự ra nhiều rễ con để hút được nhiều nước, muối khoáng.","Tiết kiệm được cây giống vì có thể thay đổi mật độ mà không phải bỏ bớt cây con.","Giúp cây tận dụng dinh dưỡng cả đất gieo và đất cấy."],a:1},
{l:2,p:"mc",n:19,t:"Mạch gỗ được cấu tạo từ hai loại tế bào là",o:["Biểu bì và nội bì","biểu bì và mạch ống","Quản bào và mạch ống.","biểu bì và lông hút"],a:2},
{l:2,p:"mc",n:20,t:"Mạch rây được cấu tạo từ",o:["tế bào ống rây và tế bào kèm.","quản bào và mạch ống.","quản bào và ống rây.","tế bào ống rây và mạch ống"],a:0},
{l:2,p:"mc",n:21,t:"Thành phần chủ yếu của dịch mạch rây là",o:["Các chất hữu cơ được tổng hợp ở lá.","Các chất hữu cơ được tổng hợp ở thân.","Các chất hữu cơ được tổng hợp ở rễ.","Các chất vô cơ được tổng hợp ở lá."],a:0},
{l:2,p:"mc",n:22,t:"Chất hữu cơ chủ yếu được vận chuyển trong hệ mạch rây là",o:["Fructose.","Glucose.","Sucrose.","Ion khoáng."],a:2},
{l:2,p:"mc",n:23,t:"Thành phần chủ yếu của dịch mạch gỗ là",o:["nước và các ion khoáng.","nước và các chất hữu cơ.","các ion khoáng.","các hợp chất hữu cơ."],a:0},
{l:2,p:"mc",n:24,t:"Động lực của dòng mạch rây là",o:["Lực đẩy do áp suất rễ.","Lực hút do thoát hơi nước ở lá.","Sự chênh lệch áp suất thẩm thấu (gradient nồng độ).","Trọng lực hút nước từ lá xuống rễ."],a:2},
{l:2,p:"mc",n:25,t:"Ghép nội dung ở cột bên phải với nội dung ở cột bên trái để trở thành một câu đúng về đặc điểm của quá trình trao đổi nước:",
  tb:[["1. Cơ chế thụ động","a. Cùng chiều gradient nồng độ."],["2. Cơ chế chủ động","b. Ngược chiều gradient nồng độ."],["","c. Tiêu tốn năng lượng ATP."],["","d. Không tiêu tốn năng lượng ATP."]],
  o:["1-bc, 2-ad","1-bd, 2-ac","1-ac, 2-bd","1-ad, 2-bc"],a:3},
{l:2,p:"mc",n:26,t:"Thực vật chỉ hấp thụ nitrogen dưới dạng?",o:["N₂ và NO₂","NH₄⁺ và NO₃⁻","Nitrogen hữu cơ.","NH₄⁺ và NO"],a:1},
{l:2,p:"mc",n:27,t:"Có bao nhiêu hoạt động nào sau đây góp phần cung cấp nitrogen cho cây hấp thụ?\n(1) Sự phóng điện trong khí quyển (sấm sét).\n(2) Hoạt động cố định nitrogen khí quyển của các vi sinh vật.\n(3) Hoạt động của các nhóm vi khuẩn phân hủy chất hữu cơ trong xác sinh vật.\n(4) Sự cung cấp nitrogen qua phân bón.",o:["1","2","3","4"],a:3,fix:1},
{l:2,p:"mc",n:28,t:"Sự biểu hiện triệu chứng thiếu nitrogen của cây là",o:["Lá nhỏ, có màu lục đậm, sinh trưởng rễ bị tiêu giảm","Sinh trưởng của các cơ quan bị giảm, xuất hiện màu vàng nhạt lá.","Lá non có màu vàng, sinh trưởng rễ bị tiêu giảm","Lá màu vàng nhạt, mép lá màu đỏ và có nhiều chấm đỏ trên mặt lá"],a:1},
{l:2,p:"mc",n:30,t:"Quá trình khử nitrate diễn ra theo sơ đồ",o:["NO₃⁻ → NO₂⁻ → NH₄⁺","NH₄⁺ → NO₂⁻ → NO₃⁻","NO₃⁻ → NO₂⁻ → NH₄⁺","NH₄⁺ → NO₃⁻ → NH₃"],a:[0,2],note:"Trong đề gốc, đáp án A và C có nội dung giống nhau nên cả hai đều được tính đúng."},
{l:2,p:"mc",n:31,t:"Trong cơ thể thực vật NH₄⁺ được đồng hóa bằng những con đường nào sau đây?\n(1) Amin hoá các keto acid để hình thành amino acid.\n(2) Chuyển vị amino acid để hình thành các amino acid mới.\n(3) Chuyển hóa trở lại thành N₂ thoát ra ngoài.\n(4) Hình thành amide để dự trữ và khử độc NH₄⁺",o:["1, 2","2, 4","1, 4","2, 3"],a:2},
{l:2,p:"mc",n:32,t:"Khi nói về sự hấp thụ nitrogen ở thực vật, phát biểu nào sai?",o:["Nitơ trong NO và NO₂ là độc hại đối với cây trồng.","Thực vật chỉ hấp thụ nitơ ở dạng NH₄⁺ và NO₃⁻","Thực vật hấp thụ được dạng nitơ phân tử (N₂).","Cây không thể trực tiếp hấp thụ nitơ trong xác sinh vật"],a:2},
{l:2,p:"mc",n:33,t:"Người ta hay trồng xen canh cây họ Đậu với cây trồng khác để tăng năng suất. Hãy giải thích vì sao?",o:["Cây họ Đậu có khả năng cung cấp dinh dưỡng cho các cây khác.","Cây họ Đậu có các vi khuẩn nốt sần giúp cố định nitrogen cung cấp cho cây.","Cây họ Đậu có khả năng tiết ra các chất xua đuổi côn trùng, sâu bọ","Cây họ Đậu có khả năng tiết ra các chất kích thích tăng trưởng."],a:1},
{l:2,p:"mc",n:34,t:"Khi nói về tưới tiêu hợp lí, có bao nhiêu phát biểu đúng?\n(1) Tưới đúng thời điểm trong ngày, vừa đủ nhu cầu của cây.\n(2) Tưới đúng nhu cầu sinh lí của cây ở từng giai đoạn sinh trưởng.\n(3) Tưới khi trời nắng nóng, nhiệt độ đất và không khí cao.\n(4) Tưới đúng phương pháp",o:["1","2","3","4"],a:2,fix:1},

{l:2,p:"tf",n:2,t:"Mỗi nhận định sau đúng hay sai khi nói về đặc điểm của sự hấp thụ khoáng theo cơ chế chủ động?",s:[["Khuếch tán theo sự chênh lệch nồng độ từ cao đến thấp.",0],["Được vận chuyển ngược chiều gradient nồng độ.",1],["Cần tiêu tốn năng lượng ATP.",1],["Hòa tan trong nước và vào rễ theo dòng nước.",0]]},
{l:2,p:"tf",n:3,t:"Mỗi nhận định sau là đúng hay sai khi nói về đặc điểm của hai con đường vận chuyển nước và chất khoáng vào mạch gỗ của rễ?",s:[["Con đường gian bào phải qua sự kiểm soát của đai Caspary.",1],["Con đường tế bào chất có tốc độ nhanh, được kiểm soát bởi đai Caspary.",0],["Con đường tế bào chất di chuyển qua tế bào chất của các tế bào thông qua cầu sinh chất.",1],["Con đường gian bào có tốc độ chậm, khó kiểm soát.",0]]},
{l:2,p:"tf",n:4,img:1,t:"Quan sát đồ thị biểu hiện mối quan hệ giữa phân bón và năng suất cây trồng. Phát biểu nào đúng, phát biểu nào sai?",s:[["[I] Lượng phân bón quá nhiều gây hại cho cây.",1],["[II] Lượng phân bón hợp lý nên năng suất ổn định.",1],["[III] Lượng dư thừa, bắt đầu gây ô nhiễm.",1],["[IV] Lượng phân bón không đủ nên năng suất thấp.",1]],note:"Các mốc I–IV trong đề tương ứng với: I là lượng cao quá mức gây độc, II là lượng tối ưu, III là lượng dư thừa gây ô nhiễm, IV là lượng thiếu."},

{l:2,p:"sa",n:4,t:"Cho các cơ chế sau: nhập bào, thẩm thấu, thẩm tách, hấp thụ chủ động, hấp thụ thụ động. Rễ cây hấp thụ khoáng từ đất theo bao nhiêu cơ chế kể trên?",a:"2"},
{l:2,p:"sa",n:5,t:"Trong các đặc điểm dưới đây, tế bào lông hút của rễ cây có bao nhiêu đặc điểm?\n(1) Thành tế bào mỏng, bề mặt thấm cutin.\n(2) Không bào trung tâm lớn.\n(3) Có áp suất thẩm thấu lớn.\n(4) Số lượng nhiều, bề mặt tiếp xúc lớn.",a:"3"},
{l:2,p:"sa",n:6,t:"Có bao nhiêu biện pháp sau giúp cho bộ rễ cây phát triển?\n(1) Phơi ải đất, cày sâu, bừa kĩ.\n(2) Tưới đủ nước và bón phân hữu cơ cho đất.\n(3) Tăng cường bón phân hóa học cho đất.\n(4) Vun gốc và xới đất cho cây.",a:"3"}
];
var PN={mc:"Nhiều lựa chọn",tf:"Đúng sai",sa:"Trả lời ngắn"};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var cfg={lesson:"all",part:"all",shuffle:true},deck=[],cur=0;

function build(list){
  var qs=list||QS.filter(function(q){return (cfg.lesson==="all"||String(q.l)===cfg.lesson)&&(cfg.part==="all"||q.p===cfg.part)});
  if(cfg.shuffle)qs=shuf(qs);
  deck=qs.map(function(q){
    var e={q:q,chosen:null,picks:{},val:"",done:false,ok:null};
    if(q.p==="mc"){var idx=q.o.map(function(_,i){return i});e.order=(cfg.shuffle&&!q.fix)?shuf(idx):idx}
    if(q.p==="tf"){var s=q.s.map(function(_,i){return i});e.order=cfg.shuffle?shuf(s):s}
    return e});
  cur=0;render();
}
function isOk(q,i){return Array.isArray(q.a)?q.a.indexOf(i)>-1:q.a===i}
function status(e){
  var q=e.q;
  if(q.p==="mc")return e.chosen===null?"new":(isOk(q,e.chosen)?"right":"wrong");
  if(q.p==="tf"){var k=Object.keys(e.picks);if(!k.length)return"new";if(k.length<q.s.length)return"part";
    return q.s.every(function(s,i){return e.picks[i]===s[1]})?"right":"wrong"}
  return e.done?(e.ok?"right":"wrong"):"new";
}
function norm(s,set){s=String(s).toLowerCase().trim();return set?s.split(/[^a-z0-9]+/).filter(Boolean).sort().join(" "):s.replace(/\s+/g,"")}

function render(){renderStats();renderGrid();renderMain()}
function renderStats(){
  var o=0,b=0;deck.forEach(function(e){var s=status(e);if(s==="right")o++;if(s==="wrong")b++});
  var n=deck.length||1;
  $("#nOk").textContent=o;$("#nBad").textContent=b;$("#nLeft").textContent=deck.length-o-b;
  $("#bOk").style.width=(o/n*100)+"%";$("#bBad").style.width=(b/n*100)+"%";
}
function renderGrid(){
  $("#grid").innerHTML=deck.map(function(e,i){
    return '<button class="c '+status(e)+(i===cur?" cur":"")+'" data-go="'+i+'" aria-label="Câu '+(i+1)+'">'+(i+1)+'</button>'}).join("");
}
function meta(e,i){
  var q=e.q;
  return '<div class="meta"><span class="chip k">Câu '+(i+1)+'/'+deck.length+'</span><span class="chip">Bài '+q.l+'</span><span class="chip">'+PN[q.p]+'</span><span class="chip">Câu gốc '+q.n+'</span></div>';
}
function renderMain(){
  var m=$("#main");
  if(!deck.length){m.innerHTML='<div class="card"><p class="qtext">Không có câu hỏi nào khớp lựa chọn này.</p></div>';return}
  if(cur>=deck.length){renderSummary();return}
  var e=deck[cur],q=e.q,h='<div class="card">'+meta(e,cur)+'<p class="qtext">'+esc(q.t)+'</p>';
  if(q.tb)h+='<div class="ctx">'+q.tb.map(function(r){return '<span><b>'+esc(r[0])+'</b></span><span>'+esc(r[1])+'</span>'}).join("")+'</div>';
  if(q.img)h+='<img class="fig" src="'+IMG+'" alt="Đồ thị năng suất theo liều lượng phân bón: thiếu thì năng suất thấp, tối ưu thì ổn định, dư thừa gây ô nhiễm, quá mức gây độc">';
  var st=status(e);
  if(q.p==="mc"){
    h+='<ol class="opts" style="list-style:none">';
    e.order.forEach(function(oi,d){
      var c="opt",mark=String.fromCharCode(65+d);
      if(e.chosen!==null){
        if(isOk(q,oi)){c+=" ok";mark="✓"}
        else if(oi===e.chosen){c+=" bad";mark="✕"}
        else c+=" dim";
        if(oi===e.chosen&&e.fresh)c+=" pop";
      }
      h+='<li><button class="'+c+'" data-opt="'+d+'"'+(e.chosen!==null?" disabled":"")+'><span class="l">'+mark+'</span><span>'+esc(q.o[oi])+'</span></button></li>'});
    h+='</ol>';
  }
  if(q.p==="tf"){
    h+='<div class="tf">';
    e.order.forEach(function(si,d){
      var s=q.s[si],pk=e.picks[si],has=pk!==undefined,c="row";
      if(has)c+=(pk===s[1]?" ok":" bad");
      var bt=function(v,txt){
        var cl="";
        if(has){if(pk===v)cl=(pk===s[1])?"right":"wrong";else if(s[1]===v)cl="was"}
        return '<button class="'+cl+'" data-tf="'+si+'" data-v="'+v+'"'+(has?" disabled":"")+'>'+txt+'</button>'};
      h+='<div class="'+c+'"><span class="l">'+String.fromCharCode(97+d)+'.</span><span>'+esc(s[0])+'</span><span class="tfb">'+bt(1,"Đúng")+bt(0,"Sai")+'</span></div>'});
    h+='</div>';
  }
  if(q.p==="sa"){
    h+='<form class="sa" id="saf"><input id="saIn" type="text" inputmode="text" autocomplete="off" placeholder="Nhập đáp án" aria-label="Đáp án" value="'+esc(e.val).replace(/"/g,"&quot;")+'"'+(e.done?" disabled":"")+'>';
    if(!e.done)h+='<button class="btn" type="submit">Kiểm tra</button><button class="btn ghost" type="button" id="saShow">Xem đáp án</button>';
    h+='</form>';
    if(e.done)h+='<div class="reveal '+(e.ok?"ok":"bad")+'">'+(e.ok?"Chính xác. Đáp án là ":"Chưa đúng. Đáp án là ")+'<b>'+esc(q.a)+'</b></div>';
  }
  var done=(st==="right"||st==="wrong");
  if(done){
    var okTxt=st==="right";
    var msg=okTxt?"Chính xác":"Chưa đúng";
    if(!okTxt&&q.p==="mc"){var ci=e.order.findIndex(function(oi){return isOk(q,oi)});msg+=", đáp án là "+String.fromCharCode(65+ci)}
    h+='<div class="fb"><p class="v '+(okTxt?"ok":"bad")+'">'+msg+'</p>'+(q.note?'<p class="note">'+esc(q.note)+'</p>':'')+'</div>';
  }
  h+='<div class="nav"><button class="btn ghost" id="prev"'+(cur===0?" disabled":"")+'>Câu trước</button><button class="btn'+(done?"":" ghost")+'" id="next">'+(cur===deck.length-1?"Xem kết quả":"Câu tiếp theo")+'</button></div></div>';
  m.innerHTML=h;
  e.fresh=false;
  var inp=$("#saIn");if(inp&&!e.done&&e.focusIn){inp.focus();}
}
function renderSummary(){
  var o=0,b=0,w=[];deck.forEach(function(e,i){var s=status(e);if(s==="right")o++;if(s==="wrong"){b++;w.push(i)}});
  var left=deck.length-o-b,pct=deck.length?Math.round(o/deck.length*100):0;
  var h='<div class="card sum"><h2>'+o+'/'+deck.length+' câu đúng ('+pct+'%)</h2><p>'+
    (left?('Còn '+left+' câu chưa làm. Bấm vào số câu ở bảng để quay lại.'):(b?'Các câu sai nằm ở bảng bên dưới. Bấm vào số để xem lại.':'Bạn làm đúng hết.'))+'</p>';
  if(w.length)h+='<div class="grid">'+w.map(function(i){return '<button class="c wrong" data-go="'+i+'">'+(i+1)+'</button>'}).join("")+'</div>';
  h+='<div class="acts">'+(b?'<button class="btn" id="redoWrong">Làm lại '+b+' câu sai</button>':'')+'<button class="btn ghost" id="redoAll">Xáo trộn và làm lại</button></div></div>';
  $("#main").innerHTML=h;
}
function go(i){cur=Math.max(0,Math.min(deck.length,i));render();window.scrollTo&&$("#main").scrollIntoView({block:"nearest"})}
function pickMC(d){var e=deck[cur];if(!e||e.q.p!=="mc"||e.chosen!==null)return;e.chosen=e.order[d];e.fresh=true;render()}
function checkSA(show){
  var e=deck[cur];if(e.done)return;var q=e.q,inp=$("#saIn");e.val=inp?inp.value:"";
  if(!show&&!e.val.trim()){inp.focus();return}
  e.done=true;e.ok=show?false:norm(e.val,q.set)===norm(q.a,q.set);render();
}
function sync(){
  $("#segLesson").querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===cfg.lesson)});
  $("#segPart").querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===cfg.part)});
}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("button");if(!t)return;
  if(t.closest("#segLesson")){cfg.lesson=t.dataset.v;sync();build();return}
  if(t.closest("#segPart")){cfg.part=t.dataset.v;sync();build();return}
  if(t.dataset.go!==undefined){go(+t.dataset.go);return}
  if(t.dataset.opt!==undefined){pickMC(+t.dataset.opt);return}
  if(t.dataset.tf!==undefined){var e=deck[cur];e.picks[t.dataset.tf]=t.dataset.v==="1"?1:0;render();return}
  if(t.id==="prev"){go(cur-1);return}
  if(t.id==="next"){go(cur+1);return}
  if(t.id==="saShow"){checkSA(true);return}
  if(t.id==="bRes"){go(deck.length);return}
  if(t.id==="bRe"||t.id==="redoAll"){build();return}
  if(t.id==="redoWrong"){var ws=deck.filter(function(e){return status(e)==="wrong"}).map(function(e){return e.q});build(ws);return}
});
document.addEventListener("submit",function(ev){ev.preventDefault();if(ev.target.id==="saf")checkSA(false)});
$("#shuf").addEventListener("change",function(){cfg.shuffle=this.checked;build()});
document.addEventListener("keydown",function(ev){
  if(ev.target.tagName==="INPUT"||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  var k=ev.key.toLowerCase(),d="abcd".indexOf(k);if(d<0&&"1234".indexOf(k)>-1)d="1234".indexOf(k);
  if(d>-1&&deck[cur]&&deck[cur].q&&cur<deck.length){pickMC(d);return}
  if(k==="arrowright"||k==="enter"&&ev.target.tagName!=="BUTTON"){go(cur+1)}
  if(k==="arrowleft"){go(cur-1)}
});
sync();build();
</script>
